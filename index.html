      function load(key, fb) {
        try {
          var raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fb;
        } catch (e) {
          return fb;
        }
      }

      function save(key, val) {
        try {
          localStorage.setItem(key, JSON.stringify(val));
        } catch (e) {}
      }

      var state = {
        cfg: Object.assign({}, DEFAULT_CFG, load(KEY_CFG, {})),
        prod: load(KEY_PROD, DEFAULT_PROD),
        cat: 'Все модели',
        search: '',
        modalProdId: null,
        selectedSize: 'M',
        ownerOpen: false,
        ownerAuth: false,
        pinErr: '',

        newName: '',
        newCat: 'Платья',
        newPrice: '',
        newCurr: 'TMT',
        newImg: '',
        newDesc: '',
        orderBox: null,
        toast: ''
      };

      function esc(s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function showToast(msg) {
        state.toast = msg;
        draw();
        setTimeout(function () {
          state.toast = '';
          draw();
        }, 2500);
      }

      function pricePair(tmt) {
        var n = Number(tmt) || 0;
        var rate = Number(state.cfg.rate) || 19.5;
        var usd = (n / rate).toFixed(2);
        if (state.cfg.currency === 'USD') {
          return { main: '$' + usd, sub: Math.round(n) + ' TMT' };
        }
        return { main: Math.round(n) + ' TMT', sub: '$' + usd };
      }

      function makeOrderText(p, sz) {
        var pr = pricePair(p.priceTmt);
        return 'Здравствуйте! Хочу заказать в ' + state.cfg.storeName + ':\n• Модель: ' + p.name + '\n• Размер: ' + sz + '\n• Цена: ' + pr.main + ' (' + pr.sub + ')';
      }

      function openOrder(channel, p, sz) {
        var txt = makeOrderText(p, sz);
        var url = 'https://www.whatsapp.com/';
        var label = '+' + state.cfg.whatsapp;
        if (channel === 'whatsapp') {
          url = 'https://api.whatsapp.com/send?phone=' + state.cfg.whatsapp + '&text=' + encodeURIComponent(txt);
          label = '+' + state.cfg.whatsapp;
        } else if (channel === 'imo') {
          url = 'https://imo.im/';
          label = '+' + state.cfg.imoPhone;
        } else if (channel === 'telegram') {
          url = 'https://t.me/' + state.cfg.telegram.replace(/^@/, '');
          label = '@' + state.cfg.telegram.replace(/^@/, '');
        } else if (channel === 'instagram') {
          url = 'https://www.instagram.com/' + state.cfg.instagram.replace(/^@/, '') + '/';
          label = '@' + state.cfg.instagram.replace(/^@/, '');
        }
        state.orderBox = { channel: channel, label: label, text: txt, url: url };
        draw();
      }

      function draw() {
        var root = document.getElementById('root');
        if (!root) return;

        var list = state.prod.filter(function (p) {
          var okCat = state.cat === 'Все модели' || p.category === state.cat;
          var q = state.search.trim().toLowerCase();
          var okQ = !q || p.name.toLowerCase().indexOf(q) !== -1 || p.category.toLowerCase().indexOf(q) !== -1;
          return okCat && okQ;
        });

        var html = '' +
          '<header>' +
            '<div class="wrap">' +
              '<div class="top-row">' +
                '<div class="brand">' +
                  '<div class="logo">M</div>' +
                  '<div>' +
                    '<div class="title">' + esc(state.cfg.storeName) + '</div>' +
                    '<div class="sub">' + esc(state.cfg.tagline) + '</div>' +
                  '</div>' +
                '</div>' +
                '<div class="actions">' +
                  '<button class="btn ' + (state.cfg.currency === 'TMT' ? 'btn-dark' : '') + '" data-act="cur" data-val="TMT">TMT</button>' +
                  '<button class="btn ' + (state.cfg.currency === 'USD' ? 'btn-dark' : '') + '" data-act="cur" data-val="USD">$ USD</button>' +
                  '<button class="btn btn-wa" data-act="quick" data-ch="whatsapp">WhatsApp</button>' +
                  '<button class="btn btn-imo" data-act="quick" data-ch="imo">imo</button>' +
                  '<button class="btn" data-act="owner">Панель владельца</button>' +
                '</div>' +
              '</div>' +
              '<div class="cats">' +
                CATEGORIES.map(function (c) {
                  return '<button class="cat-btn ' + (state.cat === c ? 'active' : '') + '" data-act="cat" data-val="' + esc(c) + '">' + esc(c) + '</button>';
                }).join('') +
              '</div>' +
            '</div>' +
          '</header>' +
          '<main class="wrap">' +
            '<div class="hero">' +
              '<div class="sub" style="color:#a1a1aa">' + esc(state.cfg.address) + '</div>' +
              '<h1>Женская одежда ' + esc(state.cfg.storeName) + '</h1>' +
              '<p>Платья, футболки, платки, брюки и куртки. Выбирайте модель, размер и пишите напрямую в WhatsApp, imo, Telegram или Instagram.</p>' +
            '</div>' +
            '<div class="toolbar">' +
              '<input id="qInput" class="field" style="margin:0;max-width:340px" value="' + esc(state.search) + '" placeholder="Поиск по каталогу..." />' +
              '<div class="sub">Найдено моделей: ' + list.length + '</div>' +
            '</div>' +
            '<div class="grid">' +
              list.map(function (p) {
                var pr = pricePair(p.priceTmt);
                return '' +
                  '<div class="card">' +
                    '<div>' +
                      '<img src="' + esc(p.img || FALLBACK) + '" alt="' + esc(p.name) + '" onerror="this.onerror=null;this.src=\'' + FALLBACK + '\'" />' +
                      '<div class="card-body">' +
                        '<div class="card-cat">' + esc(p.category) + (p.inStock ? ' · В наличии' : ' · Нет в наличии') + '</div>' +
                        '<h2 class="card-title">' + esc(p.name) + '</h2>' +
                        '<div><span class="price-main">' + esc(pr.main) + '</span><span class="price-sub">' + esc(pr.sub) + '</span></div>' +
                        '<div class="card-desc">' + esc(p.desc) + '</div>' +
                        '<div class="sizes">' + p.sizes.map(function (s) { return '<span class="sz">' + esc(s) + '</span>'; }).join('') + '</div>' +
                      '</div>' +
                    '</div>' +
                    '<div class="card-foot">' +
                      '<button class="btn btn-dark" style="flex:1" data-act="openp" data-id="' + esc(p.id) + '">Заказать</button>' +
                      '<button class="btn btn-wa" data-act="ordcard" data-ch="whatsapp" data-id="' + esc(p.id) + '">WA</button>' +
                      '<button class="btn btn-imo" data-act="ordcard" data-ch="imo" data-id="' + esc(p.id) + '">imo</button>' +
                    '</div>' +
                  '</div>';
              }).join('') +
            '</div>' +
          '</main>' +
          '<footer>' +
            '<div class="wrap">' +
              '<div style="font-size:18px;font-weight:bold;color:#fff;margin-bottom:6px">' + esc(state.cfg.storeName) + '</div>' +

                  '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">' +
                    curP.sizes.map(function (s) {
                      return '<button class="btn ' + (s === activeSz ? 'btn-dark' : '') + '" data-act="sz" data-val="' + esc(s) + '">' + esc(s) + '</button>';
                    }).join('') +
                  '</div>' +
                  '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
                    '<button class="btn btn-wa" data-act="ordm" data-ch="whatsapp" data-id="' + esc(curP.id) + '">Заказать в WhatsApp</button>' +
                    '<button class="btn btn-imo" data-act="ordm" data-ch="imo" data-id="' + esc(curP.id) + '">Заказать в imo</button>' +

        if (state.orderBox) {
          html += '' +
            '<div class="modal-bg" data-act="closeord">' +

                '<div class="modal-box" style="max-width:380px" data-stop="1">' +
                  '<h3 style="margin:0 0 8px">Панель владельца</h3>' +
                  '<div class="sub" style="margin-bottom:10px">PIN по умолчанию: 0505</div>' +
                  '<input id="pinField" type="password" class="field" placeholder="Введите PIN" />' +
                  (state.pinErr ? '<div style="color:#dc2626;font-size:12px;margin-bottom:8px">' + esc(state.pinErr) + '</div>' : '') +
                  '<div style="display:flex;gap:8px">' +
                    '<button class="btn btn-dark" data-act="checkpin" data-right="' + esc(savedPin) + '">Войти</button>' +
                    '<button class="btn" data-act="closeown">Отмена</button>' +
                  '</div>' +
                '</div>' +
              '</div>';
          } else {
            html += '' +
              '<div class="modal-bg" data-act="closeown">' +
                '<div class="modal-box" data-stop="1">' +
                  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
                    '<h3 style="margin:0">Управление каталогом</h3>' +
                    '<button class="btn" data-act="closeown">Закрыть</button>' +
                  '</div>' +
                  '<div style="display:flex;gap:8px;margin-bottom:14px">' +
                    '<button class="btn ' + (state.ownerTab === 'list' ? 'btn-dark' : '') + '" data-act="otab" data-val="list">Товары (' + state.prod.length + ')</button>' +
                    '<button class="btn ' + (state.ownerTab === 'cfg' ? 'btn-dark' : '') + '" data-act="otab" data-val="cfg">Контакты и курс</button>' +
                  '</div>';

            if (state.ownerTab === 'list') {
              html += '' +
                '<div style="background:#f4f4f5;padding:12px;border-radius:14px;margin-bottom:14px">' +
                  '<div style="font-weight:bold;font-size:13px;margin-bottom:8px">Добавить товар</div>' +
                  '<input id="nName" class="field" value="' + esc(state.newName) + '" placeholder="Название модели" />' +
                  '<div style="display:flex;gap:8px">' +
                    '<select id="nCat" class="field">' +
                      CATEGORIES.slice(1).map(function (c) {
                        return '<option value="' + esc(c) + '" ' + (state.newCat === c ? 'selected' : '') + '>' + esc(c) + '</option>';
                      }).join('') +
                    '</select>' +
                    '<input id="nPrice" type="number" class="field" value="' + esc(state.newPrice) + '" placeholder="Цена" />' +
                    '<select id="nCurr" class="field" style="max-width:95px">' +
                      '<option value="TMT" ' + (state.newCurr === 'TMT' ? 'selected' : '') + '>TMT</option>' +
                      '<option value="USD" ' + (state.newCurr === 'USD' ? 'selected' : '') + '>USD</option>' +
                    '</select>' +
                  '</div>' +
                  '<input id="nImg" class="field" value="' + esc(state.newImg) + '" placeholder="Ссылка на фото (или выберите файл ниже)" />' +
                  '<input type="file" accept="image/*" id="nFile" style="margin-bottom:10px;font-size:12px" />' +
                  '<input id="nDesc" class="field" value="' + esc(state.newDesc) + '" placeholder="Короткое описание" />' +
                  '<button class="btn btn-dark" data-act="addprod">+ Добавить товар</button>' +
                '</div>' +
                state.prod.map(function (p) {
                  return '' +
                    '<div class="row-item">' +
                      '<div>' +
                        '<div style="font-weight:bold;font-size:13px">' + esc(p.name) + '</div>' +
                        '<div class="sub">' + esc(p.category) + ' · ' + esc(pricePair(p.priceTmt).main) + '</div>' +
                      '</div>' +
                      '<div style="display:flex;gap:6px">' +
                        '<button class="btn" data-act="stock" data-id="' + esc(p.id) + '">' + (p.inStock ? 'В наличии' : 'Нет в наличии') + '</button>' +
                        '<button class="btn" data-act="del" data-id="' + esc(p.id) + '">Удалить</button>' +
                      '</div>' +
                    '</div>';
                }).join('');
            } else {
              html += '' +
                '<div class="sub">WhatsApp / imo</div>' +
                '<input id="cWa" class="field" value="' + esc(state.cfg.whatsapp) + '" />' +
                '<div class="sub">Telegram (без @)</div>' +
                '<input id="cTg" class="field" value="' + esc(state.cfg.telegram) + '" />' +
                '<div class="sub">Instagram (без @)</div>' +
                '<input id="cIg" class="field" value="' + esc(state.cfg.instagram) + '" />' +
                '<div class="sub">Адрес</div>' +
                '<input id="cAdr" class="field" value="' + esc(state.cfg.address) + '" />' +
                '<div class="sub">Курс 1 USD в TMT</div>' +
                '<input id="cRate" type="number" step="0.1" class="field" value="' + esc(state.cfg.rate) + '" />' +
                '<button class="btn btn-dark" data-act="savecfg">Сохранить настройки</button>';
            }

            html += '</div></div>';
          }
        }

        if (state.toast) {
          html += '<div class="toast">' + esc(state.toast) + '</div>';
        }

        root.innerHTML = html;
      }

      document.addEventListener('click', function (e) {
        var stop = e.target.closest('[data-stop="1"]');
        var el = e.target.closest('[data-act]');
        if (!el) return;
        var act = el.dataset.act;
        if (stop && (act === 'closem' || act === 'closeord' || act === 'closeown')) {
          if (e.target !== el) return;
        }

        if (act === 'cur') {
          state.cfg.currency = el.dataset.val;
          save(KEY_CFG, state.cfg);
          draw();
        } else if (act === 'cat') {
          state.cat = el.dataset.val;
          draw();
        } else if (act === 'openp') {
          state.modalProdId = el.dataset.id;
          state.selectedSize = 'M';
          draw();
        } else if (act === 'closem') {
          state.modalProdId = null;
          draw();
        } else if (act === 'sz') {
          state.selectedSize = el.dataset.val;
          draw();
        } else if (act === 'ordcard') {
          var p1 = state.prod.find(function (x) { return x.id === el.dataset.id; });
          if (p1) openOrder(el.dataset.ch, p1, p1.sizes[0] || 'M');
        } else if (act === 'ordm') {
          var p2 = state.prod.find(function (x) { return x.id === el.dataset.id; });
          if (p2) openOrder(el.dataset.ch, p2, state.selectedSize || p2.sizes[0] || 'M');
        } else if (act === 'quick') {
          var dummy = { name: 'Запрос по каталогу', priceTmt: 0, sizes: ['M'] };
          openOrder(el.dataset.ch, dummy, 'M');
        } else if (act === 'closeord') {
          state.orderBox = null;
          draw();
        } else if (act === 'owner') {
          state.ownerOpen = true;
          state.pinErr = '';
          draw();
        } else if (act === 'closeown') {
          state.ownerOpen = false;
          draw();
        } else if (act === 'checkpin') {
          var inp = document.getElementById('pinField');
          if (inp && inp.value.trim() === el.dataset.right) {
            state.ownerAuth = true;
            state.pinErr = '';
            draw();
          } else {
            state.pinErr = 'Неверный PIN (по умолчанию 0505)';
            draw();
          }
        } else if (act === 'otab') {
          state.ownerTab = el.dataset.val;
          draw();
        } else if (act === 'stock') {
          state.prod = state.prod.map(function (x) {
            return x.id === el.dataset.id ? Object.assign({}, x, { inStock: !x.inStock }) : x;
          });
          save(KEY_PROD, state.prod);
          draw();
          showToast('Статус обновлён');
        } else if (act === 'del') {
          state.prod = state.prod.filter(function (x) { return x.id !== el.dataset.id; });
          save(KEY_PROD, state.prod);
          draw();
          showToast('Товар удалён');
        } else if (act === 'addprod') {
          var nName = ((document.getElementById('nName') || {}).value || '').trim();
          var nCat = (document.getElementById('nCat') || {}).value || 'Платья';
          var nPrice = Number(((document.getElementById('nPrice') || {}).value) || 0);
          var nCurr = (document.getElementById('nCurr') || {}).value || 'TMT';
          var nImg = ((document.getElementById('nImg') || {}).value || '').trim();
          var nDesc = ((document.getElementById('nDesc') || {}).value || '').trim();
          if (!nName || !(nPrice > 0)) {
            showToast('Укажите название и цену');
            return;
          }
          var rate = Number(state.cfg.rate) || 19.5;
          var tmt = nCurr === 'USD' ? Math.round(nPrice * rate) : Math.round(nPrice);
          state.prod.unshift({
            id: String(Date.now()),
            name: nName,
            category: nCat,
            priceTmt: tmt,
            sizes: ['S', 'M', 'L'],
            inStock: true,
            desc: nDesc,
            img: nImg || FALLBACK
          });
          state.newName = '';
          state.newPrice = '';
          state.newImg = '';
          state.newDesc = '';
          save(KEY_PROD, state.prod);
          draw();
          showToast('Товар добавлен');
        } else if (act === 'savecfg') {
          state.cfg.whatsapp = ((document.getElementById('cWa') || {}).value || '').replace(/\D/g, '');
          state.cfg.imoPhone = state.cfg.whatsapp;
          state.cfg.telegram = ((document.getElementById('cTg') || {}).value || '').replace(/^@/, '').trim();
          state.cfg.instagram = ((document.getElementById('cIg') || {}).value || '').replace(/^@/, '').trim();
          state.cfg.address = ((document.getElementById('cAdr') || {}).value || '').trim();
          state.cfg.rate = Number(((document.getElementById('cRate') || {}).value) || 19.5) || 19.5;
          save(KEY_CFG, state.cfg);
          draw();
          showToast('Настройки сохранены');
        }
      });

      document.addEventListener('input', function (e) {
        if (!e.target) return;
        if (e.target.id === 'qInput') {
          state.search = e.target.value;
          draw();
          var el = document.getElementById('qInput');
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        } else if (e.target.id === 'nName') {
          state.newName = e.target.value;
        } else if (e.target.id === 'nPrice') {
          state.newPrice = e.target.value;
        } else if (e.target.id === 'nImg') {
          state.newImg = e.target.value;
        } else if (e.target.id === 'nDesc') {
          state.newDesc = e.target.value;
        }
      });

      document.addEventListener('change', function (e) {
        if (e.target && e.target.id === 'nFile' && e.target.files && e.target.files[0]) {
          var file = e.target.files[0];
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
              var canvas = document.createElement('canvas');
              var w = img.width;
              var h = img.height;
              var max = 700;
              if (w > max || h > max) {
                if (w >= h) { h = Math.round(h * max / w); w = max; }
                else { w = Math.round(w * max / h); h = max; }
              }
              canvas.width = w;
              canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              state.newImg = canvas.toDataURL('image/jpeg', 0.72);
              draw();
              showToast('Фото загружено');
            };
            img.src = String(ev.target.result || '');
          };
          reader.readAsDataURL(file);
        }
      });

      draw();
    })();
  </script>
</body>
</html>
